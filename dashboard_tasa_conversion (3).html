<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tasa de Conversión - Yango</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc;
    padding: 20px;
    color: #1e293b;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .subtitle { color: #64748b; font-size: 12px; margin-bottom: 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px;
  }
  .card .ciudad {
    font-size: 14px;
    font-weight: 600;
    color: #475569;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card .porcentaje {
    font-size: 36px;
    font-weight: 700;
    color: #2563eb;
    margin-bottom: 8px;
  }
  .card .detalle {
    font-size: 13px;
    color: #64748b;
  }
  .barra-bg {
    background: #e2e8f0;
    border-radius: 6px;
    height: 8px;
    overflow: hidden;
    margin: 10px 0;
  }
  .barra-fill {
    background: linear-gradient(90deg, #2563eb, #60a5fa);
    height: 100%;
    transition: width 0.5s ease;
  }
  .card.total {
    background: #1e293b;
    color: white;
  }
  .card.total .ciudad { color: #cbd5e1; }
  .card.total .porcentaje { color: #60a5fa; }
  .card.total .detalle { color: #94a3b8; }
  .error {
    background: #fee2e2;
    color: #991b1b;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>

<h1>Tasa de Conversión: Conductor Registrado → Activado</h1>
<div class="subtitle" id="subtitle">Cargando...</div>
<div class="error" id="errorBox"></div>
<div class="grid" id="grid"></div>

<script>
const SUPABASE_URL = 'https://hzrdikgiftdtprhducdq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_lFfGaZGZgtwi6JvNPsdAqg_qhe7nhwp'; // clave publicable, segura para exponer en el navegador
const REFRESH_MS = 60000; // se actualiza cada 60 segundos

async function cargarDatos() {
  const errorBox = document.getElementById('errorBox');
  try {
    const ciudades = ['Cali', 'Barranquilla'];
    const filas = [];

    for (const ciudad of ciudades) {
      const headersComunes = {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        Prefer: 'count=exact'
      };

      const respEnviados = await fetch(
        SUPABASE_URL + '/rest/v1/yango_drivers?city=eq.' + encodeURIComponent(ciudad) + '&ghl_contact_id=not.is.null&select=external_driver_id&limit=1',
        { headers: headersComunes }
      );
      if (!respEnviados.ok) throw new Error('HTTP ' + respEnviados.status + ' (enviados ' + ciudad + '): ' + await respEnviados.text());
      const totalEnviados = parseInt(respEnviados.headers.get('content-range').split('/')[1], 10);

      const respActivados = await fetch(
        SUPABASE_URL + '/rest/v1/yango_drivers?city=eq.' + encodeURIComponent(ciudad) + '&ghl_pipeline_status=in.(pending_moved_to_trip,moved_to_trip)&select=external_driver_id&limit=1',
        { headers: headersComunes }
      );
      if (!respActivados.ok) throw new Error('HTTP ' + respActivados.status + ' (activados ' + ciudad + '): ' + await respActivados.text());
      const totalActivados = parseInt(respActivados.headers.get('content-range').split('/')[1], 10);

      const tasa = totalEnviados > 0 ? ((totalActivados / totalEnviados) * 100).toFixed(2) : '0.00';

      filas.push({
        city: ciudad,
        total_enviados_a_ghl: totalEnviados,
        total_activados: totalActivados,
        tasa_conversion_porcentaje: tasa
      });
    }

    renderizar(filas);
    document.getElementById('subtitle').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CO');
    errorBox.style.display = 'none';
  } catch (err) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'Error: ' + err.message;
  }
}

function renderizar(filas) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  let totalEnviados = 0;
  let totalActivados = 0;

  for (const fila of filas) {
    totalEnviados += fila.total_enviados_a_ghl;
    totalActivados += fila.total_activados;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="ciudad">📍 ${fila.city}</div>
      <div class="porcentaje">${fila.tasa_conversion_porcentaje}%</div>
      <div class="barra-bg"><div class="barra-fill" style="width:${fila.tasa_conversion_porcentaje}%"></div></div>
      <div class="detalle">${fila.total_activados} activados de ${fila.total_enviados_a_ghl} registrados</div>
    `;
    grid.appendChild(card);
  }

  const tasaTotal = totalEnviados > 0 ? ((totalActivados / totalEnviados) * 100).toFixed(2) : 0;
  const cardTotal = document.createElement('div');
  cardTotal.className = 'card total';
  cardTotal.innerHTML = `
    <div class="ciudad">🌎 TOTAL GENERAL</div>
    <div class="porcentaje">${tasaTotal}%</div>
    <div class="barra-bg"><div class="barra-fill" style="width:${tasaTotal}%"></div></div>
    <div class="detalle">${totalActivados} activados de ${totalEnviados} registrados</div>
  `;
  grid.appendChild(cardTotal);
}

cargarDatos();
setInterval(cargarDatos, REFRESH_MS);
</script>

</body>
</html>
